name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # A stored key must never turn a test into a live model call.
      SECRETS_NO_KEYRING: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups --extra excel

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest --cov=src --cov-report=term-missing

      # Every step below uses the scripted writer: no model, no network.
      - name: Build the warehouse
        run: uv run analyst build-db

      - name: Golden set runs read-only and matches its digests
        run: uv run analyst golden

      - name: Agent answers with the scripted writer
        run: uv run analyst ask "How many customers are there in each segment?" --fake

      - name: Adversarial suite executes zero writes
        run: uv run analyst safety --fake

      - name: Arms A and C run end to end on the example rows
        run: |
          uv run analyst eval --arm A --fake --golden tests/fixtures/example.jsonl --out "$RUNNER_TEMP/runs"
          uv run analyst eval --arm C --fake --golden tests/fixtures/example.jsonl --out "$RUNNER_TEMP/runs"
          uv run analyst report "$RUNNER_TEMP/runs/armA.jsonl" "$RUNNER_TEMP/runs/armC.jsonl"
